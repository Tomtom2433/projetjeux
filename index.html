<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>LAST SIGNAL</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="rain"></div>
    <div id="vignette"></div>
    <div id="labels"></div>
    <div id="hud" hidden>
      <div id="status"></div>
      <div id="topright"></div>
      <div id="team"></div>
      <div id="bottom">
        <div id="coach" hidden></div>
        <button id="ticker" hidden></button>
        <div id="orders" hidden></div>
      </div>
      <canvas id="minimap" width="264" height="198"></canvas>
      <div id="perf" hidden></div>
      <div id="toasts"></div>
      <div id="edges"></div>
      <div id="tut-ring" hidden></div>
    </div>
    <div id="overlay" hidden></div>
    <div id="rotate" hidden>
      <div>
        <b>LAST SIGNAL</b>
        <p>Le jeu est conçu pour le mode paysage. Tournez votre appareil.</p>
        <button id="rotate-ok">Continuer en portrait</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
